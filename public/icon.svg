<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1038" />
      <stop offset="50%" stop-color="#180a24" />
      <stop offset="100%" stop-color="#0e0517" />
    </linearGradient>
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff758f" />
      <stop offset="50%" stop-color="#ff4d6d" />
      <stop offset="100%" stop-color="#c9184a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe6a7" />
      <stop offset="100%" stop-color="#ffb703" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="506" height="506" x="3" y="3" rx="125" fill="none" stroke="rgba(255, 117, 143, 0.3)" stroke-width="6" />

  <!-- Outer Glowing Orbital Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255, 77, 109, 0.45)" stroke-width="8" stroke-dasharray="8 14" filter="url(#glow)" />
  
  <!-- Orbiting Cycle Beads -->
  <circle cx="256" cy="96" r="14" fill="#ff4d6d" filter="url(#glow)" />
  <circle cx="396" cy="196" r="10" fill="#ff758f" />
  <circle cx="396" cy="316" r="14" fill="url(#goldGrad)" filter="url(#glow)" />
  <circle cx="256" cy="416" r="10" fill="#9d4edd" />
  <circle cx="116" cy="316" r="10" fill="#c9184a" />
  <circle cx="116" cy="196" r="12" fill="#ff4d6d" />

  <!-- Center Glowing Crystal Flower / Lotus -->
  <g filter="url(#glow)" transform="translate(256, 256) scale(1.35)">
    <!-- Crescent Moon Backdrop -->
    <path d="M -30,-45 A 50,50 0 0,0 20,45 A 40,40 0 0,1 -30,-45" fill="url(#goldGrad)" opacity="0.85" />

    <!-- Lotus Petals -->
    <path d="M 0,30 C -25,10 -35,-20 0,-45 C 35,-20 25,10 0,30 Z" fill="url(#gemGrad)" />
    <path d="M -10,30 C -35,15 -45,-10 -20,-30 C -5,-15 5,10 -10,30 Z" fill="#ff758f" opacity="0.9" />
    <path d="M 10,30 C 35,15 45,-10 20,-30 C 5,-15 -5,10 10,30 Z" fill="#ff758f" opacity="0.9" />

    <!-- Center Light Diamond -->
    <polygon points="0,-15 10,0 0,15 -10,0" fill="#ffffff" />
  </g>
</svg>
